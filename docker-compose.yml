# Sobe tudo na sua máquina: docker compose up --build
#   site:       http://localhost:8080
#   phpMyAdmin: http://localhost:8081
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8080:80"
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_NAME: purplebyte
      DB_USER: purplebyte
      DB_PASS: purplebyte
    volumes:
      - uploads:/var/www/backend/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: purplebyte
      MARIADB_USER: purplebyte
      MARIADB_PASSWORD: purplebyte
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
      # na primeira vez, cria as tabelas e o conteúdo inicial
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db:
  uploads:
